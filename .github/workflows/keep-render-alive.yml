
name: Keep Render MCP Server Alive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          echo "Checking Render server..."
          curl -v -f \
            --connect-timeout 20 \
            --max-time 90 \
            https://ai-agents-qkgf.onrender.com/health
          echo "Render server responded successfully!"
