
name: Keep Render MCP Server Alive

on:
  schedule:
    - cron: "3/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render MCP Health Endpoint
        run: |
          curl -fsS --connect-timeout 30 --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            "https://ai-agents-qkgf.onrender.com/health"
