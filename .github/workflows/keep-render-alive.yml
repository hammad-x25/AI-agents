
name: Keep Render MCP Server Alive

on:
  push:
    branches:
      - main

  schedule:
    - cron: "17,27,37,47,57 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -fsS --connect-timeout 30 --max-time 120 \
            --retry 3 --retry-delay 10 \
            https://ai-agents-qkgf.onrender.com/health
